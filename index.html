<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1020">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Lunachris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <style>
    html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    #game { width: 100%; height: 100%; }
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
    #game canvas { image-rendering: auto !important; width: 100% !important; height: 100% !important; display: block; margin: 0 !important; }   /* always fill the screen; smooth upscaling (Phaser sets "pixelated" when zoomed) */
    #err { position: fixed; left: 0; right: 0; bottom: 0; max-height: 40%; overflow: auto; margin: 0; padding: 8px 10px; background: rgba(160, 0, 0, .92); color: #fff; font: 12px/1.4 monospace; white-space: pre-wrap; display: none; z-index: 10; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 50; background: #0b1020; color: #ffd23f; align-items: center; justify-content: center; text-align: center; font: 15px/1.8 'Press Start 2P', monospace; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    #mute { position: fixed; top: 22px; right: 8px; z-index: 6; width: 34px; height: 28px; padding: 0; border: 1px solid #3a4266; border-radius: 6px; background: rgba(11,16,32,.6); color: #fff; font-size: 16px; line-height: 1; opacity: .75; touch-action: manipulation; }
    #rotate .logo { font-size: 40px; line-height: 1; color: #ffd23f; letter-spacing: 2px; text-shadow: 0 4px 0 #1a1020, 3px 0 0 #1a1020, -3px 0 0 #1a1020, 0 -3px 0 #1a1020; margin-bottom: 6px; }
    #rotate .sub { font-size: 10px; color: #fff; margin-bottom: 26px; }
    #rotate .hint { font-size: 9px; color: #6b7390; margin-top: 18px; }
    #ver { position: fixed; top: 4px; right: 6px; color: #6b7390; font: 9px 'Press Start 2P', monospace; z-index: 5; pointer-events: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ver"></div>
  <button id="mute" aria-label="Sound on/off">&#128266;</button>
  <div id="rotate"><div><div class="logo">LUNA<br>CHRIS</div><div class="sub">SPACE-RANCH HERO</div>&#8635;<br>Rotate your phone<br>to landscape<div class="hint">tap for music</div></div></div>
  <pre id="err"></pre>

  <script>
    // On-screen error overlay so JS errors are visible when testing on a phone.
    (function () {
      var box = document.getElementById('err');
      function show(msg) { box.style.display = 'block'; box.textContent += msg + '\n'; }
      window.addEventListener('error', function (e) { show('ERROR: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')'); });
      window.addEventListener('unhandledrejection', function (e) { show('PROMISE: ' + (e.reason && e.reason.message || e.reason)); });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
    // Tapping the rotate prompt is a user gesture, so the title tune can start before the phone is even turned.
    document.getElementById('rotate').addEventListener('pointerup', function () {
      if (typeof Sound !== 'undefined') { Sound.init(); Sound.music('title'); }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  </script>
  <script>
    // Load src/boot.js fresh every time (with a cache-busting timestamp); it loads the game scripts.
    // The file list lives there so a cached copy of this page can never miss a new script.
    (function () {
      var s = document.createElement('script');
      s.src = 'src/boot.js?t=' + Date.now();
      s.onerror = function () { var b = document.getElementById('err'); b.style.display = 'block'; b.textContent += 'Failed to load src/boot.js\n'; };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
