<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1020">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Lunachris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <style>
    html, body { margin: 0; height: 100%; background: #0b1020; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    #game { width: 100%; height: 100%; }
    #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
    #game canvas { image-rendering: auto !important; width: 100% !important; height: 100% !important; display: block; margin: 0 !important; }   /* always fill the screen; smooth upscaling (Phaser sets "pixelated" when zoomed) */
    #err { position: fixed; left: 0; right: 0; bottom: 0; max-height: 40%; overflow: auto; margin: 0; padding: 8px 10px; background: rgba(160, 0, 0, .92); color: #fff; font: 12px/1.4 monospace; white-space: pre-wrap; display: none; z-index: 10; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 50; background: #0b1020; color: #ffd23f; align-items: center; justify-content: center; text-align: center; font: 15px/1.8 'Press Start 2P', monospace; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    #mute { display: none !important; position: fixed; top: 22px; right: 8px; z-index: 6; width: 34px; height: 28px; padding: 0; border: 1px solid #3a4266; border-radius: 6px; background: rgba(11,16,32,.6); color: #fff; font-size: 16px; line-height: 1; opacity: .75; touch-action: manipulation; }
    #rotate .logo { font-size: 40px; line-height: 1; color: #ffd23f; letter-spacing: 2px; text-shadow: 0 4px 0 #1a1020, 3px 0 0 #1a1020, -3px 0 0 #1a1020, 0 -3px 0 #1a1020; margin-bottom: 6px; }
    #rotate .sub { font-size: 10px; color: #fff; margin-bottom: 26px; padding: 0 16px; line-height: 1.7; }
    #rotate .hint { font-size: 9px; color: #6b7390; margin-top: 18px; }
    #ver { position: fixed; bottom: 4px; right: 6px; color: #6b7390; font: 9px 'Press Start 2P', monospace; z-index: 5; pointer-events: none; }
    /* the loading screen: plain HTML so it's up before Phaser or any game script has arrived */
    #boot { position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; background: #0b1020; color: #fff; font-family: 'Press Start 2P', monospace; text-align: center; transition: opacity .45s; overflow: hidden; }
    #boot.gone { opacity: 0; pointer-events: none; }
    #boot .stars { position: absolute; inset: -50%; background-image: radial-gradient(2px 2px at 10% 20%, #fff, transparent), radial-gradient(2px 2px at 70% 30%, #9fd8ff, transparent), radial-gradient(2px 2px at 40% 80%, #ffd23f, transparent), radial-gradient(1px 1px at 85% 65%, #fff, transparent), radial-gradient(1px 1px at 25% 55%, #ff9db8, transparent), radial-gradient(2px 2px at 55% 10%, #fff, transparent); background-size: 240px 240px; animation: bootDrift 40s linear infinite; opacity: .7; }
    @keyframes bootDrift { to { transform: translate(240px, 120px); } }
    #boot .box { position: relative; width: min(440px, calc(100vw - 32px)); }
    #boot .logo { font-size: clamp(28px, 7vw, 46px); line-height: 1.05; color: #ffd23f; letter-spacing: 2px; text-shadow: 0 4px 0 #1a1020, 3px 0 0 #1a1020, -3px 0 0 #1a1020, 0 -3px 0 #1a1020, 0 8px 0 #5a0a0a; }
    #boot .sub { font-size: 8px; color: #b9a8ff; margin: 14px 0 26px; line-height: 1.7; }
    #boot .moon { width: 34px; height: 34px; margin: 0 auto 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2a0 0 30%, #ffd23f 31% 70%, #d89a1a 71%); box-shadow: 0 0 0 3px #1a1020, 0 0 24px #ffd23f88; position: relative; animation: bootBob 1.2s ease-in-out infinite; }
    #boot .moon::before, #boot .moon::after { content: ''; position: absolute; border-radius: 50%; background: #d89a1a; }
    #boot .moon::before { width: 8px; height: 8px; left: 8px; top: 18px; } #boot .moon::after { width: 5px; height: 5px; left: 21px; top: 8px; }
    @keyframes bootBob { 50% { transform: translateY(-8px) rotate(20deg); } }
    #boot .bar { height: 18px; padding: 3px; background: #1a1030; border: 3px solid #ffd23f; box-shadow: 0 0 0 3px #1a1020, 5px 5px 0 3px rgba(0,0,0,.45); }
    #boot .fill { height: 100%; width: 0%; transition: width .25s; background: repeating-linear-gradient(90deg, #ffd23f 0 12px, #ffb52a 12px 16px); }
    #boot .msg { font-size: 8px; color: #9fd8ff; margin-top: 16px; min-height: 10px; line-height: 1.6; }
    #boot .msg::after { content: ''; animation: bootDots 1s steps(4) infinite; }
    @keyframes bootDots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ver"></div>
  <button id="mute" aria-label="Sound on/off">&#128266;</button>
  <div id="rotate"><div><div class="logo">LUNA<br>CHRIS</div><div class="sub">RETIRED CHEF, EX-ASTRONAUT, HERO</div>&#8635;<br>Rotate your phone<br>to landscape<div class="hint">tap for music</div></div></div>
  <pre id="err"></pre>
  <div id="boot"><div class="stars"></div><div class="box"><div class="moon"></div><div class="logo">LUNA<br>CHRIS</div><div class="sub">RETIRED CHEF, EX-ASTRONAUT, HERO</div><div class="bar"><div class="fill"></div></div><div class="msg">WARMING UP THE GRILL</div></div></div>
  <script>
    // LCBoot.set(fraction, message) moves the loading bar; LCBoot.done() fades the screen away (the title is ready)
    window.LCBoot = (function () {
      var el = document.getElementById('boot'), fill = el.querySelector('.fill'), msg = el.querySelector('.msg'), at = 0;
      return {
        set: function (f, m) { at = Math.max(at, Math.min(1, f)); fill.style.width = Math.round(at * 100) + '%'; if (m) msg.textContent = m; },
        done: function () { if (!el.parentNode) return; this.set(1); setTimeout(function () { el.classList.add('gone'); setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500); }, 150); }
      };
    })();
    LCBoot.set(0.04);
  </script>

  <script>
    // On-screen error overlay so JS errors are visible when testing on a phone.
    (function () {
      var box = document.getElementById('err');
      function show(msg) { box.style.display = 'block'; box.textContent += msg + '\n'; }
      window.addEventListener('error', function (e) { show('ERROR: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')'); });
      window.addEventListener('unhandledrejection', function (e) { show('PROMISE: ' + (e.reason && e.reason.message || e.reason)); });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js" onload="LCBoot.set(0.2, 'UNPACKING THE SHOPPING')"></script>
  <script>
    // Tapping the rotate prompt is a user gesture, so the title tune can start before the phone is even turned.
    document.getElementById('rotate').addEventListener('pointerup', function () {
      if (typeof Sound !== 'undefined') { Sound.init(); Sound.music('title'); }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  </script>
  <script>
    // Load src/boot.js fresh every time (with a cache-busting timestamp); it loads the game scripts.
    // The file list lives there so a cached copy of this page can never miss a new script.
    (function () {
      var s = document.createElement('script');
      s.src = 'src/boot.js?t=' + Date.now();
      s.onerror = function () { var b = document.getElementById('err'); b.style.display = 'block'; b.textContent += 'Failed to load src/boot.js\n'; };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
