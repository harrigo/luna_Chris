name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r src _site/
          [ -d assets ] && cp -r assets _site/ || true
          [ -d icons ] && cp -r icons _site/ || true
      - name: Pack the editable sprites into one sheet
        run: |
          pip install --quiet pillow
          python3 tools/pack_sprites.py _site/assets/sprites
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
